#
# Builds GodseonDongle.app and its root helper on a macOS runner (Xcode). The VM image is the
# GodseonDongle-VM release pinned in vm-assets.env, which build_app.sh downloads and checks.
# Every run keeps the zipped app as an artifact; a v* tag also publishes it as a GitHub release
# together with the VM image's corresponding source (vm_assets-sources.tar.gz, the same file as
# in the GodseonDongle-VM release), since the app zip carries the image's GPL binaries. The app
# is ad-hoc signed, as with a local build.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write   # gh release create, on tags only
    steps:
      - uses: actions/checkout@v7
      - name: Check the English strings
        run: python3 app/tools/check_strings.py
      - name: Build the app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.1.0; fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          # --release also fetches the VM image's source archive (262 MB) for the release: tags only
          release=""; if [ "$GITHUB_REF_TYPE" = tag ]; then release=--release; fi
          GODSEON_VERSION=$version ./app/build_app.sh $release
      - name: Zip the app
        run: |
          name=GodseonDongle-$VERSION
          if [ "$GITHUB_REF_TYPE" != tag ]; then name=$name-${GITHUB_SHA::7}; fi
          ditto -c -k --keepParent dist/GodseonDongle.app "dist/$name.zip"
          echo "ZIP=dist/$name.zip" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: GodseonDongle
          path: ${{ env.ZIP }}
          if-no-files-found: error
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" dist/vm_assets-sources.tar.gz \
            --title "GodseonDongle $VERSION" --generate-notes
