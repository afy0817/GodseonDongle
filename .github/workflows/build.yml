#
# Runs only when a v* tag is pushed (e.g. v0.3.0): builds GodseonDongle.app and its root helper
# on a macOS runner (Xcode) and publishes the zipped app as that tag's GitHub release. The VM
# image is the GodseonDongle-VM release pinned in vm-assets.env, which build_app.sh downloads and
# checks. Since the app zip carries the image's GPL binaries, the release also gets the image's
# corresponding source (vm_assets-sources.tar.gz, the same file as in the GodseonDongle-VM
# release). The app is ad-hoc signed, as with a local build.
name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@v7
      - name: Check the English strings
        run: python3 app/tools/check_strings.py
      - name: Build the app
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >>"$GITHUB_ENV"
          # --release also fetches the VM image's source archive (262 MB) for the release
          GODSEON_VERSION=$version ./app/build_app.sh --release
      - name: Zip the app
        run: |
          zip=dist/GodseonDongle-$VERSION.zip
          ditto -c -k --keepParent dist/GodseonDongle.app "$zip"
          echo "ZIP=$zip" >>"$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" dist/vm_assets-sources.tar.gz \
            --title "GodseonDongle $VERSION" --generate-notes
