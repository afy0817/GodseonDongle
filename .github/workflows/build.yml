#
# Builds GodseonDongle.app in two steps: the VM image on an arm64 Linux runner (it is built
# with Docker, which macOS runners cannot run), then the app and the root helper on a macOS
# runner (Xcode). Every run keeps the zipped app as an artifact; a v* tag also publishes it
# as a GitHub release. The app is ad-hoc signed, as with a local build.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: VM image (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build the VM image
        run: THRURNDIS_WIFI_VERSION="godseon-${GITHUB_SHA::7}" sh vm/build.sh dist/vm_assets
      - uses: actions/upload-artifact@v7
        with:
          name: vm_assets
          path: dist/vm_assets
          if-no-files-found: error
          retention-days: 7

  app:
    name: App (macOS)
    needs: vm
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write   # gh release create, on tags only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vm_assets
          path: dist/vm_assets
      - name: Check the English strings
        run: python3 app/tools/check_strings.py
      - name: Build the app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=0.1.0; fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          # build_app.sh skips the Docker step because dist/vm_assets is already there
          GODSEON_VERSION=$version ./app/build_app.sh
      - name: Zip the app
        run: |
          name=GodseonDongle-$VERSION
          if [ "$GITHUB_REF_TYPE" != tag ]; then name=$name-${GITHUB_SHA::7}; fi
          ditto -c -k --keepParent dist/GodseonDongle.app "dist/$name.zip"
          echo "ZIP=dist/$name.zip" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: GodseonDongle
          path: ${{ env.ZIP }}
          if-no-files-found: error
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "GodseonDongle $VERSION" --generate-notes
